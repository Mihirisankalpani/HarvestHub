<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarvestHub - Product Listing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        h1 {
            margin: 0;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
        }
        .filters {
            flex-basis: 20%;
            padding: 20px;
        }
        .products {
            flex-basis: 75%;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .product {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            width: 30%;
        }
        .product img {
            max-width: 100%;
            height: auto;
        }
        .product h2 {
            font-size: 1.5rem;
        }
        .filters label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .filters input {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>HarvestHub - Available Produce</h1>
    </header>

    <div class="container">
        <!-- Filters Section -->
        <aside class="filters">
            <h2>Filters</h2>
            <label>
                <input type="checkbox" name="category" value="fruits"> Fruits
            </label>
            <label>
                <input type="checkbox" name="category" value="vegetables"> Vegetables
            </label>
            <label>
                <input type="checkbox" name="category" value="grains"> Grains
            </label>
            <button onclick="filterProducts()">Apply Filters</button>
        </aside>

        <!-- Product Listing Section -->
        <section class="products">
            <!-- Product 1 -->
            <div class="product" data-category="fruits">
                <img src="apple.jpg" alt="Apple">
                <h2>Apple</h2>
                <p>$2.00 per lb</p>
            </div>
            <!-- Product 2 -->
            <div class="product" data-category="vegetables">
                <img src="carrot.jpg" alt="Carrot">
                <h2>Carrot</h2>
                <p>$1.50 per lb</p>
            </div>
            <!-- Product 3 -->
            <div class="product" data-category="grains">
                <img src="rice.jpg" alt="Rice">
                <h2>Rice</h2>
                <p>$0.80 per lb</p>
            </div>
            <!-- More products -->
        </section>
    </div>

    <script>
        function filterProducts() {
            // Get selected filters
            const filters = document.querySelectorAll('input[name="category"]:checked');
            const selectedCategories = Array.from(filters).map(input => input.value);
            
            // Get all products
            const products = document.querySelectorAll('.product');

            // Show or hide products based on selected filters
            products.forEach(product => {
                const category = product.getAttribute('data-category');
                if (selectedCategories.length === 0 || selectedCategories.includes(category)) {
                    product.style.display = 'block';
                } else {
                    product.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
